services:
    # image project
    app:
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        working_dir: /var/www/
        volumes:
            - ./html:/var/www
        depends_on:
            - redis
        networks:
            - intranet_db

    # nginx
    nginx:
        image: nginx:alpine
        restart: unless-stopped
        ports:
            - "8003:80"
        volumes:
            - ./html:/var/www
            - ./docker/nginx/:/etc/nginx/conf.d/
        depends_on:
            - app
            
        networks:
            - intranet_db
    
    #vite
    vite:
        image: node:22-alpine 
        restart: unless-stopped
        working_dir: /var/www
        volumes:
        - ./html:/var/www 
        ports:
        - "5173:5173" 
        command: sh -c "npm install && npm run dev"     
        depends_on:
        - app
        - nginx
        networks:
            - intranet_db
    redis:
        image: redis:latest
        restart: unless-stopped
        networks:
            - intranet_db

networks:
    intranet_db:
        external: true